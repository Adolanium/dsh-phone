name: DSHPhone
options:
  bundleIdPrefix: com.adolanium
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  DSHPhone:
    type: application
    platform: iOS
    sources:
      - path: DSHPhone
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adolanium.dshphone
        INFOPLIST_FILE: DSHPhone/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      gatherCoverageData: false
      testTargets:
        - DSHPhoneTests
  DSHPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DSHPhoneTests
    dependencies:
      - target: DSHPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adolanium.dshphone.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DSHPhone.app/DSHPhone"
        BUNDLE_LOADER: "$(TEST_HOST)"
